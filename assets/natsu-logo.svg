<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">NatsuTech logo</title>
  <desc id="desc">A neon lightning logo for NatsuTech</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#132c52"/>
      <stop offset="1" stop-color="#28104b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 160px 160px; }
      .orbit { animation: orbit 7s linear infinite; transform-origin: 160px 160px; }
      @keyframes pulse { 0%,100% { opacity: .78; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.03); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect x="8" y="8" width="304" height="304" rx="76" fill="url(#bg)" stroke="#00e5ff" stroke-width="4"/>
  <circle class="pulse" cx="160" cy="160" r="108" fill="none" stroke="#00e5ff" stroke-opacity=".22" stroke-width="2"/>
  <g class="orbit" fill="#00e5ff" filter="url(#glow)">
    <circle cx="160" cy="40" r="5"/>
    <circle cx="280" cy="160" r="4"/>
    <circle cx="40" cy="160" r="3"/>
  </g>
  <path class="pulse" d="M177 42 92 177h57l-18 101 97-151h-61z" fill="url(#bolt)" stroke="#ffffff" stroke-opacity=".8" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="160" y="298" text-anchor="middle" fill="#e8eef7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">NATSU</text>
</svg>